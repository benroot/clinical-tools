<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mean Arterial Pressure</title>

  <!-- Icons: .ico for older browsers, SVG for current ones, the touch
       icon for iOS home screens, and the manifest for Android -->
  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../manifest.webmanifest">

  <!-- Bootstrap 5.3: base styling, responsive grid, accessible defaults -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Shared scaffold styles for this family of apps -->
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>

  <main class="app-shell" x-data="mapCalculator()">

    <header class="app-header">
      <h1>Mean Arterial Pressure</h1>
      <p>Enter a blood pressure to calculate mean arterial pressure (MAP).</p>
    </header>

    <form novalidate @submit.prevent="calculate()">

      <div class="field-group">
        <label for="blood-pressure" class="form-label">Blood pressure (mmHg)</label>
        <input
          type="text"
          id="blood-pressure"
          name="blood-pressure"
          class="form-control"
          inputmode="numeric"
          autocomplete="off"
          placeholder="e.g. 120/60"
          aria-describedby="blood-pressure-hint"
          x-model="bloodPressureInput"
          @input="calculate()">
        <div id="blood-pressure-hint" class="field-hint">
          Format: systolic/diastolic, in mmHg.
        </div>
        <p
          class="is-invalid-message text-danger mt-1"
          x-show="errorMessage"
          x-text="errorMessage"
          role="alert"></p>
      </div>

    </form>

    <section
      class="result-panel"
      aria-live="polite"
      :hidden="!hasResult">

      <p class="result-label">Mean arterial pressure</p>
      <output class="result-value" for="blood-pressure" x-text="mapDisplay"></output>
      <p class="calc-result">
        (2 × <span x-text="diastolic"></span> + <span x-text="systolic"></span>) ÷ 3
      </p>
      <p class="field-hint" x-show="note" x-text="note"></p>
    </section>

  </main>

  <app-disclaimer></app-disclaimer>

  <!-- Alpine.js: adds reactive behavior directly to the semantic HTML above -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="app.js"></script>
  <script src="../shared/disclaimer.js"></script>
</body>
</html>
